<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>クーポン抽選キャンペーン</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="coupon-site">


    <!-- =================================
         抽選前画面
    ================================== -->

    <div id="startScreen">


        <!-- =================================
             キャンペーンロゴ画像
        ================================== -->

        <section class="campaign-logo">

            <img
                src="images/imagescampaign-logo.png"
                alt="クーポン抽選キャンペーン"
                class="campaign-logo-image"
            >

        </section>


        <!-- =================================
             開催期間
        ================================== -->

        <div class="campaign-period">
            2026.8.10~2026.9.10
        </div>


        <!-- =================================
             クーポン取得ボタン
        ================================== -->

        <section class="coupon-button-area">

            <button
                type="button"
                id="couponBtn"
                class="coupon-button"
            >
                クーポン取得
            </button>

        </section>


        <!-- =================================
             区切り線
        ================================== -->

        <div class="section-divider"></div>


        <!-- =================================
             クーポンリスト
        ================================== -->

        <section class="coupon-list">

            <h2 class="coupon-list-title">
                クーポンリスト
            </h2>


            <!-- 1等 -->

            <div class="coupon-item rank-1">

                <div class="rank-label">
                    <span>1等</span>
                </div>

                <div class="coupon-content">
                    ドリンク一杯無料券
                </div>

            </div>


            <!-- 2等 -->

            <div class="coupon-item rank-2">

                <div class="rank-label">
                    <span>2等</span>
                </div>

                <div class="coupon-content">
                    10%OFFクーポン
                </div>

            </div>


            <!-- 3等 -->

            <div class="coupon-item rank-3">

                <div class="rank-label">
                    <span>3等</span>
                </div>

                <div class="coupon-content">
                    5%OFFクーポン
                </div>

            </div>

        </section>

    </div>


    <!-- =================================
     抽選結果画面
================================= -->

<div id="resultScreen" class="hidden">

    <!-- =================================
         結果画面 上部
         background-logo.pngを背景として使用
    ================================== -->

    <section class="result-top">

        <img
            src="images/background-logo.png"
            alt=""
            class="result-background"
        >

        <!-- 抽選結果の文字 -->
        <h2 class="result-title">
            抽選結果
        </h2>

        <!-- =================================
             当選内容
        ================================== -->

        <div
            id="resultCouponItem"
            class="coupon-item"
        >

            <!-- 当選した等賞のリボン -->
            <div class="rank-label">

                <span id="rankText"></span>

            </div>

            <!-- 当選したクーポン -->
            <div
                class="coupon-content"
                id="couponText"
            >
            </div>

        </div>

    </section>


    <!-- =================================
         もう一度引く
    ================================== -->

    <button
        type="button"
        id="retryBtn"
        class="coupon-button result-retry-button"
    >
        もう一度引く
    </button>

</div>
</main>


<!-- =================================
     JavaScript
================================== -->

<script src="script.js"></script>

</body>
</html>
