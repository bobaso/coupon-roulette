<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>クーポン抽選キャンペーン</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="coupon-site">


    <!-- =================================
         抽選前画面
    ================================== -->

    <div id="startScreen">


        <!-- =================================
             キャンペーンロゴ画像
        ================================== -->

        <section class="campaign-logo">

            <img
                src="images/imagescampaign-logo.png"
                alt="クーポン抽選キャンペーン"
                class="campaign-logo-image"
            >

        </section>


        <!-- =================================
             開催期間
        ================================== -->

        <div class="campaign-period">
            2026.8.10~2026.9.10
        </div>


        <!-- =================================
             クーポン取得ボタン
        ================================== -->

        <section class="coupon-button-area">

            <button
                type="button"
                id="couponBtn"
                class="coupon-button"
            >
                クーポン取得
            </button>

        </section>


        <!-- =================================
             区切り線
        ================================== -->

        <div class="section-divider"></div>


<!-- =================================
     クーポンリスト
================================== -->

<section class="coupon-list">

    <h2 class="coupon-list-title">
        クーポンリスト
    </h2>

    <!-- JavaScriptで自動生成 -->
    <div id="couponList"></div>

        </section>

    </div>

<!-- =========================================
     抽選中画面
========================================= -->

<section id="lotteryScreen" class="hidden">

<!-- =================================
     スキップボタン
================================== -->

<button
    id="skipButton"
    class="skip-button"
    type="button">
    Skip▶︎
</button>


<!-- =================================
     抽選中
================================== -->

<div class="lottery-text">
    抽選中
</div>


<!-- =================================
     ガチャ演出
================================== -->

<div class="gacha-animation">

    <!-- ガチャ機 -->

    <img
        id="gachaMachine"
        class="gacha-machine"
        src="images/gacha-machine.png"
        alt="抽選中">


<!-- =================================
     排出されるカプセル
================================== -->

<div
    id="gachaCapsule"
    class="gacha-capsule">

    <!-- カプセル下半分 -->
    <div class="capsule-bottom-wrap">

        <img
            src="images/capsule-bottom.png"
            class="capsule-bottom"
            alt="">

    </div>


    <!-- カプセル中央の光 -->
    <div class="capsule-light"></div>


    <!-- カプセル上半分 -->
    <div class="capsule-top-wrap">

        <img
            src="images/capsule-top.png"
            class="capsule-top"
            alt="">

    </div>

</div>
<!-- =================================
     カプセルから出る光
================================== -->

<div
    id="lotteryLight"
    class="lottery-light">
</div>


<!-- =================================
     ホワイトアウト
================================== -->

<div
    id="whiteout"
    class="whiteout">
</div>

</section>

<!-- =================================
     抽選結果画面
================================= -->

<div id="resultScreen" class="hidden">

    <!-- =================================
         結果画面上部
    ================================== -->

    <section class="result-top">


        <!-- 抽選結果タイトル -->

        <h2 class="result-title">
            抽選結果
        </h2>


        <!-- =================================
             当選結果

             coupon-item
             rank-1～rank-3
             をクーポンリストと共通利用
        ================================== -->

        <div
            id="resultCouponItem"
            class="coupon-item"
        >

            <div class="rank-label">

                <span id="rankText"></span>

            </div>


            <div
                class="coupon-content"
                id="couponText"
            ></div>

        </div>


    </section>


    <!-- =================================
         もう一度引く
    ================================== -->

<!-- クーポンを使用ボタン -->
<button class="result-use-button">
    クーポンを使用する
</button>

<!-- もう一度引くボタン -->
<button
    id="retryBtn"
    class="result-retry-button"
>
    SNSをフォローして<br>クーポンを引き直し
</button>


</div>

    </main>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script src="script.js"></script>

</body>
</html>
