<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>クーポン抽選キャンペーン</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="coupon-site">

<!-- =================================
     キャンペーンロゴ画像
     画像サイズ：430 × 480px
================================== -->

<section class="campaign-logo">

    <img
        src="imagescampaign-logo.png"
        alt="クーポン抽選キャンペーン"
        class="campaign-logo-image"
    >

</section>


        <!-- =================================
             クーポン取得ボタン
        ================================== -->
        <section class="coupon-button-area">

            <button
                type="button"
                class="coupon-button"
            >
                クーポン取得
            </button>

        </section>


        <!-- =================================
             区切り線
        ================================== -->
        <div class="section-divider"></div>


        <!-- =================================
             クーポンリスト
        ================================== -->
        <section class="coupon-list">

            <h2 class="coupon-list-title">
                クーポンリスト
            </h2>


            <!-- 1等 -->
            <div class="coupon-item rank-1">

                <div class="rank-label">
                    <span>1等</span>
                </div>

                <div class="coupon-content">
                    ドリンク無料券
                </div>

            </div>


            <!-- 2等 -->
            <div class="coupon-item rank-2">

                <div class="rank-label">
                    <span>2等</span>
                </div>

                <div class="coupon-content">
                    10%OFFクーポン
                </div>

            </div>


            <!-- 3等 -->
            <div class="coupon-item rank-3">

                <div class="rank-label">
                    <span>3等</span>
                </div>

                <div class="coupon-content">
                    5%OFFクーポン
                </div>

            </div>


            <!--
                4等以降を追加する場合は
                このcoupon-itemをコピーして増やせます。
            -->

        </section>

    </main>

</body>
</html>
